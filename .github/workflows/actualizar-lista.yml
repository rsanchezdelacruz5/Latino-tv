name: Actualizar lista Latino TV HD

on:
  workflow_dispatch:
  schedule:
    - cron: "15 10 * * *"
  push:
    branches:
      - main
    paths:
      - "crear_latino_tv_hd.py"
      - ".github/workflows/actualizar-lista.yml"

permissions:
  contents: write

jobs:
  build-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Generar lista M3U
        run: python3 crear_latino_tv_hd.py

      - name: Publicar cambios
        run: |
          if git diff --quiet -- Latino-TV-HD.m3u; then
            echo "La lista no presenta cambios."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Latino-TV-HD.m3u
            git commit -m "Actualizar lista Latino TV HD"
            git push
          fi
